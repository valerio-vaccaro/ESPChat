; ESPChat - bitchat compatible BLE mesh client for WT32-SC01 / WT32-SC01 Plus
; Build:  pio run -e wt32-sc01-plus   |   pio run -e wt32-sc01
; Flash:  pio run -e <env> -t upload && pio device monitor

[platformio]
default_envs = wt32-sc01-plus

[env]
platform = espressif32@6.6.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_ldf_mode = chain
lib_deps =
    lvgl/lvgl@~8.3.11
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@~1.4.2
    rweather/Crypto@^0.4.0
build_flags =
    -std=gnu++17
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=2
    -DBUILD_EPOCH=$UNIX_TIME          ; UTC seconds at build time: initial clock until synced from the mesh
build_unflags = -std=gnu++11

; ---------------------------------------------------------------------------
; WT32-SC01 : ESP32-WROVER-B, 4MB flash, PSRAM, ST7796 SPI, FT6336 touch
; No speaker / microphone on board (an external I2S DAC/mic can be wired, see
; include/board_config.h).
; ---------------------------------------------------------------------------
[env:wt32-sc01]
board = esp-wrover-kit
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_SC01
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3

; ---------------------------------------------------------------------------
; WT32-SC01 Plus : ESP32-S3, 16MB flash, 2MB PSRAM, ST7796 8-bit parallel,
; FT6336 touch, NS4168 I2S speaker amplifier, micro SD slot.
; ---------------------------------------------------------------------------
[env:wt32-sc01-plus]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_SC01_PLUS
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
lib_deps =
    ${env.lib_deps}
    earlephilhower/ESP8266Audio@1.9.7
